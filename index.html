<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f5ef" />
  <title>Olive & Ember — Neighborhood Kitchen</title>
  <style>
    :root {
      --cream: #f8f5ef;
      --paper: #fffdf9;
      --ink: #25291f;
      --muted: #77786f;
      --green: #344d38;
      --green-light: #e6ebdf;
      --orange: #e78654;
      --line: #eae5db;
      --shadow: 0 12px 35px rgba(44, 48, 37, .08);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .topbar {
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--green);
      color: white;
      font-size: 12px;
      letter-spacing: .04em;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(248, 245, 239, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(234, 229, 219, .8);
    }
    .nav {
      max-width: 1180px;
      height: 76px;
      margin: auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.04em; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 12px;
      display: grid; place-items: center; background: var(--green); color: white;
      font-size: 19px;
    }
    .brand-name { font-size: 18px; }
    .brand-name span { color: var(--orange); }
    .nav-links { display: flex; align-items: center; gap: 30px; color: #5d5e55; font-size: 14px; }
    .nav-links a:hover { color: var(--orange); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .icon-button, .menu-toggle {
      border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      border-radius: 13px; width: 42px; height: 42px; display: grid; place-items: center;
      position: relative;
    }
    .icon-button:hover, .menu-toggle:hover { border-color: var(--green); }
    .cart-count {
      position: absolute; top: -6px; right: -6px; min-width: 19px; height: 19px;
      padding: 0 5px; border-radius: 20px; background: var(--orange); color: white;
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
    }
    .menu-toggle { display: none; }

    .hero {
      max-width: 1180px; margin: 0 auto; padding: 54px 24px 42px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 42px; align-items: center;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; color: var(--green);
      background: var(--green-light); border-radius: 30px; padding: 9px 13px;
      font-size: 12px; font-weight: 700; letter-spacing: .04em;
    }
    .eyebrow i { width: 7px; height: 7px; background: var(--orange); border-radius: 50%; }
    h1 {
      margin: 18px 0 15px; font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(46px, 6vw, 73px); line-height: .99; letter-spacing: -.055em; font-weight: 500;
    }
    h1 em { color: var(--orange); font-weight: 500; }
    .hero-copy { max-width: 440px; color: var(--muted); line-height: 1.7; font-size: 15px; }
    .hero-buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 26px; }
    .btn {
      border: 0; border-radius: 13px; padding: 13px 18px; font-weight: 700;
      transition: transform .2s, box-shadow .2s, background .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--green); color: white; box-shadow: 0 8px 18px rgba(52,77,56,.19); }
    .btn-primary:hover { background: #263e2a; }
    .btn-quiet { background: transparent; color: var(--ink); }
    .btn-quiet span { color: var(--orange); margin-left: 5px; }
    .hero-meta { display: flex; gap: 23px; margin-top: 32px; color: var(--muted); font-size: 12px; }
    .hero-meta strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }
    .hero-image-wrap { position: relative; min-height: 400px; }
    .hero-image {
      height: 400px; width: 100%; object-fit: cover; border-radius: 28px;
      box-shadow: var(--shadow);
    }
    .floating-note {
      position: absolute; left: -20px; bottom: 24px; background: var(--paper);
      padding: 14px 17px; border-radius: 16px; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 11px;
    }
    .note-icon { font-size: 23px; }
    .floating-note strong { display: block; font-size: 13px; }
    .floating-note small { color: var(--muted); font-size: 11px; }

    .section { max-width: 1180px; margin: auto; padding: 30px 24px 70px; }
    .section-heading {
      display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 23px;
    }
    .section-heading h2 {
      margin: 0; font: 500 clamp(30px, 4vw, 42px)/1.1 Georgia, "Times New Roman", serif;
      letter-spacing: -.035em;
    }
    .section-heading p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .view-all { border: 0; background: none; color: var(--green); font-weight: 700; padding: 8px 0; }
    .view-all:hover { color: var(--orange); }

    .filters { display: flex; gap: 9px; overflow-x: auto; padding: 2px 0 18px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      flex: 0 0 auto; padding: 10px 15px; border: 1px solid var(--line); border-radius: 30px;
      background: var(--paper); color: #62645b; font-size: 13px; font-weight: 600;
    }
    .filter.active, .filter:hover { background: var(--green); border-color: var(--green); color: white; }

    .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .dish-card {
      background: var(--paper); border: 1px solid #efebe3; border-radius: var(--radius);
      overflow: hidden; transition: transform .22s, box-shadow .22s;
    }
    .dish-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .dish-photo { height: 184px; position: relative; overflow: hidden; background: #e9e4d9; }
    .dish-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
    .dish-card:hover .dish-photo img { transform: scale(1.05); }
    .badge {
      position: absolute; top: 12px; left: 12px; background: rgba(255,253,249,.93);
      border-radius: 30px; padding: 6px 9px; font-size: 10px; color: var(--green); font-weight: 800;
    }
    .dish-info { padding: 15px; }
    .dish-title-row { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
    .dish-title-row h3 { margin: 0; font: 600 16px Georgia, "Times New Roman", serif; }
